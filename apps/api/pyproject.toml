[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-api"
version = "0.1.0"
description = "Vantage market intelligence API foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "openai>=1.40,<2",
  "pgvector>=0.3,<1",
  "playwright>=1.47,<2",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() in argument defaults is the framework's own idiom.
# BLE001: this codebase deliberately catches broad Exception at a few documented
#   boundaries (one bad discovered page, a best-effort browser fallback, the top-level
#   request error handler) so one failure can't take down an unrelated request/run.
# UP046: pydantic v2 generic models here predate stable PEP 695 generic-class support;
#   not worth the risk of changing generic-model semantics for a style rule.
ignore = ["B008", "BLE001", "UP046"]
